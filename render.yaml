services:
  - type: web
    name: the-script-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_DATA_MODE=static npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_DATA_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html