[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-script-nfl"
version = "0.1.0"
description = "Leakage-safe WR receiving-yards research pipeline"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "polars>=1.0",
]

[project.optional-dependencies]
data = ["nflreadpy>=0.1.5", "polars>=1.0"]
baseline = ["scikit-learn>=1.5", "xgboost>=2.1"]
neural = ["torch>=2.4"]
api = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]
dev = ["jupyter>=1.1", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
the-script = "the_script.cli:main"
the-script-api = "the_script.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
